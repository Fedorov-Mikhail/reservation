spring.application.name=reservation

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/reservation}
spring.datasource.username=${DB_USERNAME:reservation_app}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.data-source-properties.options=-c lock_timeout=5000 -c statement_timeout=15000 -c timezone=UTC

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# Local MVP: no user accounts yet. Do not expose it publicly.
server.address=127.0.0.1
server.port=${SERVER_PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

booking.policy.min-duration-minutes=1
booking.policy.max-duration-hours=24
booking.policy.horizon-days=365
booking.policy.max-search-days=31

logging.pattern.level=%5p [requestId:%X{requestId:-}]
# Expected integrity conflicts are translated and logged at the HTTP boundary.
# Unexpected SQL errors are logged by ApiExceptionHandler with their exception.
logging.level.org.hibernate.orm.jdbc.error=OFF

