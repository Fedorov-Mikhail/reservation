spring.application.name=reservation

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/reservation}
spring.datasource.username=${DB_USERNAME:reservation_app}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.data-source-properties.options=-c lock_timeout=5000 -c statement_timeout=15000 -c timezone=UTC

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# Local development binds to loopback; containers override SERVER_ADDRESS.
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=never

booking.policy.min-duration-minutes=1
booking.policy.max-duration-hours=24
booking.policy.horizon-days=365
booking.policy.max-search-days=31

logging.pattern.level=%5p [requestId:%X{requestId:-}]
# Expected integrity conflicts are translated and logged at the HTTP boundary.
# Unexpected SQL errors are logged by ApiExceptionHandler with their exception.
logging.level.org.hibernate.orm.jdbc.error=OFF

app.bootstrap.username=${ADMIN_USERNAME:}
app.bootstrap.password=${ADMIN_PASSWORD:}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db

app.email.enabled=${EMAIL_ENABLED:false}
app.email.from=${EMAIL_FROM:}
app.email.base-url=${FRONTEND_URL:http://127.0.0.1:5173}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.calendar.enabled=${GOOGLE_CALENDAR_ENABLED:false}
app.calendar.client-id=${GOOGLE_CLIENT_ID:}
app.calendar.client-secret=${GOOGLE_CLIENT_SECRET:}
app.calendar.redirect-uri=${GOOGLE_REDIRECT_URI:http://127.0.0.1:8080/api/v1/me/calendar/callback}
app.calendar.frontend-url=${FRONTEND_URL:http://127.0.0.1:5173}
app.calendar.encryption-key=${CALENDAR_ENCRYPTION_KEY:}
management.health.mail.enabled=false
